<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>New Tab</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --a:#f59e0b; --bg:#090704; --line:rgba(245,158,11,.34); }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; font-family:Arial,Helvetica,sans-serif; color:#eee; }
    body {
      background:
        radial-gradient(circle at 50% 50%, transparent 15px, rgba(245,158,11,.24) 16px, transparent 17px) 0 0/54px 62px,
        radial-gradient(circle at 50% 50%, transparent 15px, rgba(245,158,11,.24) 16px, transparent 17px) 27px 31px/54px 62px,
        linear-gradient(#17130b,#090704);
    }
    .app { height:100%; display:flex; flex-direction:column; }
    .tabs { height:48px; display:flex; align-items:flex-end; padding:0 14px; border-bottom:1px solid var(--line); background:rgba(8,7,4,.82); }
    .tab { height:38px; min-width:220px; padding:0 14px; display:flex; align-items:center; justify-content:space-between; border:1px solid var(--a); border-bottom:0; border-radius:9px 9px 0 0; color:var(--a); font-size:21px; font-weight:700; background:rgba(245,158,11,.07); }
    .toolbar { height:64px; display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); background:rgba(11,9,5,.88); }
    button { width:42px; height:42px; border:1px solid var(--line); border-radius:10px; background:#15110b; color:#ddd; font-size:20px; cursor:pointer; }
    button:hover { color:var(--a); border-color:var(--a); }
    #address { flex:1; height:42px; border:1px solid var(--line); border-radius:12px; background:#15110b; color:#fff; padding:0 16px; font-size:19px; outline:none; }
    #address:focus { border-color:var(--a); }
    .content { flex:1; min-height:0; position:relative; }
    #browserFrame { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
    #home { position:absolute; inset:0; display:grid; place-items:center; background:linear-gradient(to bottom,transparent 70%,rgba(0,0,0,.48)); }
    #home[hidden], #browserFrame[hidden] { display:none !important; }
    .center { text-align:center; transform:translateY(-4vh); }
    .brand { color:var(--a); font-size:72px; font-weight:300; letter-spacing:18px; margin-bottom:38px; }
    .search { width:min(580px,72vw); height:60px; display:flex; align-items:center; border:1px solid var(--line); border-radius:14px; background:rgba(20,16,10,.9); padding:0 18px; }
    .search input { width:100%; border:0; outline:0; background:transparent; color:#fff; font-size:20px; font-weight:650; }
    #status { margin-top:14px; min-height:20px; color:#f0b84c; font-size:14px; }
  </style>

  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script src="/baremux/index.js"></script>
  <script src="/epoxy/index.js"></script>
  <script src="/register-sw.js"></script>
</head>
<body>
  <div class="app">
    <div class="tabs">
      <div class="tab"><span id="tabTitle">New Tab</span><span>×</span></div>
    </div>

    <div class="toolbar">
      <button id="backBtn" title="Back">←</button>
      <button id="forwardBtn" title="Forward">→</button>
      <button id="reloadBtn" title="Reload">↻</button>
      <button id="homeBtn" title="Home">⌂</button>
      <input id="address" placeholder="Search or enter URL" autocomplete="off">
    </div>

    <main class="content">
      <section id="home">
        <div class="center">
          <div class="brand">tung tung</div>
          <form id="homeForm" class="search">
            <input id="homeInput" placeholder="Search or enter URL..." autocomplete="off">
          </form>
          <div id="status"></div>
        </div>
      </section>

      <iframe
        id="browserFrame"
        hidden
        allow="autoplay; fullscreen; gamepad; clipboard-write; encrypted-media; picture-in-picture"
      ></iframe>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
